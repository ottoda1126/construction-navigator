<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Construction Navigator Simulator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: työmaatabletti – häiriöilmoitus ylhäällä, tietolähteet vasemmalla, päätöspaneeli oikealla */
:root{
  --bg:#E8EBE8; --surface:#FFFFFF; --surface-2:#F2F4F2; --line:#D2D7D3; --fg:#1A211F; --muted:#56615C;
  --primary:#21476A; --primary-fg:#FFFFFF; --primary-soft:#E0E9F1;
  --alert:#8F5600; --alert-bg:#FFF1D6; --alert-line:#E7B257;
  --ai:#0A6A63; --ai-bg:#E0F0EC; --ai-line:#9CCFC6;
  --good:#2C7439; --good-bg:#E3F1E5; --bad:#A8352A; --bad-bg:#F8E3E0; --warn:#9A6200;
  --st-v:#8A9590; --st-l:#4C78A0; --st-s:#5C9E6A; --st-k:#DDA23C;
  --font-d:"Barlow Condensed","Arial Narrow",sans-serif;
  --font-b:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-m:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1C2220; --surface-2:#232A27; --line:#343C38; --fg:#E4E8E5; --muted:#99A39E;
  --primary:#8DB6DC; --primary-fg:#0D1A26; --primary-soft:#1E2C39;
  --alert:#F2B54A; --alert-bg:#2E2412; --alert-line:#6B5020;
  --ai:#55C7B8; --ai-bg:#132C28; --ai-line:#2A5A52;
  --good:#7CC98A; --good-bg:#16291A; --bad:#EE8B7F; --bad-bg:#33191A; --warn:#E9B35A;
  --st-v:#6A7570; --st-l:#5E8DB8; --st-s:#5FA86E; --st-k:#D49A35;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1C2220; --surface-2:#232A27; --line:#343C38; --fg:#E4E8E5; --muted:#99A39E;
  --primary:#8DB6DC; --primary-fg:#0D1A26; --primary-soft:#1E2C39;
  --alert:#F2B54A; --alert-bg:#2E2412; --alert-line:#6B5020;
  --ai:#55C7B8; --ai-bg:#132C28; --ai-line:#2A5A52;
  --good:#7CC98A; --good-bg:#16291A; --bad:#EE8B7F; --bad-bg:#33191A; --warn:#E9B35A;
  --st-v:#6A7570; --st-l:#5E8DB8; --st-s:#5FA86E; --st-k:#D49A35;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--font-b);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--font-d);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2rem;letter-spacing:.01em} h2{font-size:1.45rem} h3{font-size:1.1rem;letter-spacing:.02em}
p{margin:0}
.mono,.num{font-family:var(--font-m);font-variant-numeric:tabular-nums}
.label{font-family:var(--font-d);font-weight:600;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto}

/* yläpalkki */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--font-d);font-weight:700;font-size:1.15rem;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand .mk{width:22px;height:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.brand .mk i{background:var(--primary);border-radius:1px}.brand .mk i:nth-child(5){background:var(--alert-line)}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav button{background:none;border:0;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted)}
.nav button[aria-current="true"]{background:var(--primary-soft);color:var(--fg)}
.prog{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.85rem;font-weight:600;border:1px solid var(--line);background:var(--surface-2)}
.chip.ai{background:var(--ai-bg);border-color:var(--ai-line);color:var(--ai)}
.chip.no{background:var(--surface-2)}
.chip.pilot{background:var(--alert-bg);border-color:var(--alert-line);color:var(--alert)}
.dots{display:flex;gap:4px}.dots i{width:18px;height:6px;border-radius:2px;background:var(--line)}.dots i.on{background:var(--primary)}.dots i.cur{background:var(--alert-line)}

/* yleiset */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--primary);background:var(--primary);color:var(--primary-fg);
  padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer;min-height:44px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.small{min-height:32px;padding:4px 12px;font-size:.9rem}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pad{padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-height:42px;width:100%}
textarea{resize:vertical}
.err{color:var(--bad);font-weight:600;font-size:.9rem}
.note{font-size:.9rem;color:var(--muted)}

/* aloitus */
.home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;padding-top:24px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.formgrid .full{grid-column:1/-1}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--primary)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--font-d);font-weight:600;letter-spacing:.04em;font-size:.9rem;color:var(--muted)}
.tscroll{overflow-x:auto}
tr.sel td{background:var(--primary-soft)}
.cond-ai{color:var(--ai);font-weight:600}
.status{display:flex;gap:8px;align-items:center;font-size:.9rem}
.status i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.status.ok i{background:var(--good)}.status.warn i{background:var(--warn)}

/* ohje */
.script{font-size:1.15rem;line-height:1.65;max-width:68ch}
.script p+p{margin-top:12px}

/* skenaario */
.alert{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;background:var(--alert-bg);border:1px solid var(--alert-line);border-radius:10px;padding:16px 18px;margin-top:18px}
.alert .clock{font-family:var(--font-m);font-size:1.5rem;font-weight:500;color:var(--alert);grid-row:span 2;align-self:center;border-right:1px solid var(--alert-line);padding-right:16px}
.alert .from{font-family:var(--font-d);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.85rem;color:var(--alert)}
.alert .txt{font-size:1.12rem;font-weight:500}
.scgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:8px 8px 0}
.tabs button{border:1px solid transparent;border-bottom:0;background:none;padding:8px 14px;border-radius:8px 8px 0 0;cursor:pointer;font-weight:600;color:var(--muted);position:relative;top:1px}
.tabs button[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--fg)}
.tabs button.seen::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-left:6px;vertical-align:middle;opacity:.6}
.tabbody{padding:16px;min-height:260px}
.empty{display:grid;place-items:center;min-height:228px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:20px}
.st{display:inline-block;padding:1px 8px;border-radius:4px;font-size:.82rem;font-weight:600;white-space:nowrap}
.st.late{background:var(--bad-bg);color:var(--bad)}.st.risk{background:var(--alert-bg);color:var(--alert)}.st.done{background:var(--good-bg);color:var(--good)}
.msg{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.msg .t{font-family:var(--font-m);font-size:.9rem;color:var(--muted);grid-row:span 2}
.msg .w{font-weight:600;font-size:.92rem}
/* tietomalli */
.model{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:4px;max-width:440px}
.model .fl{font-family:var(--font-m);font-size:.85rem;color:var(--muted);align-self:center;padding-right:8px}
.model .fl.cur{color:var(--fg);font-weight:500}
.model .c{height:40px;border-radius:3px;display:grid;place-items:center;font-family:var(--font-d);font-weight:700;font-size:.95rem;color:#fff;border:1px solid transparent}
.model .c.v{background:var(--st-v)}.model .c.l{background:var(--st-l)}.model .c.s{background:var(--st-s)}
.model .c.k{background:repeating-linear-gradient(135deg,var(--st-k) 0 6px,transparent 6px 11px);border-color:var(--st-k);color:var(--fg)}
.model .c.n{border:1px dashed var(--line);color:var(--muted)}
.model .c.cur{outline:2px solid var(--fg);outline-offset:1px}
.model .hd{font-family:var(--font-d);font-weight:600;text-align:center;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:2px;display:inline-block}
.notes{margin:14px 0 0;padding-left:18px}.notes li{margin:4px 0}

/* päätöspaneeli */
.ai{background:var(--ai-bg);border:1px solid var(--ai-line);border-radius:10px;padding:16px}
.ai .hd{display:flex;align-items:center;gap:8px;color:var(--ai);font-family:var(--font-d);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.9rem}
.ai .hd i{width:10px;height:10px;border-radius:2px;background:var(--ai);transform:rotate(45deg)}
.ai h4{margin:12px 0 4px;font-family:var(--font-d);font-weight:600;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ai)}
.chain{display:flex;flex-direction:column;gap:0;margin:4px 0}
.chain span{position:relative;padding:3px 0 3px 18px;font-size:.95rem}
.chain span::before{content:"";position:absolute;left:4px;top:11px;width:7px;height:7px;border-radius:50%;background:var(--ai)}
.chain span+span::after{content:"";position:absolute;left:7px;top:-6px;height:14px;width:1px;background:var(--ai-line)}
.rec{background:var(--surface);border:1px solid var(--ai-line);border-radius:8px;padding:10px 12px;font-weight:600}
.srcs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.srcs button{border:1px solid var(--ai-line);background:var(--surface);color:var(--ai);border-radius:99px;padding:2px 10px;font-size:.85rem;cursor:pointer;font-weight:600}
.steps{display:flex;gap:6px;padding:14px 16px 0}
.steps span{flex:1;font-family:var(--font-d);font-weight:600;font-size:.88rem;letter-spacing:.04em;color:var(--muted);border-top:3px solid var(--line);padding-top:6px}
.steps span.on{color:var(--fg);border-color:var(--primary)}.steps span.done{border-color:var(--st-v)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;background:var(--surface)}
.opt input{width:18px;height:18px;margin-top:3px;accent-color:var(--primary);flex:none}
.opt:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.opt.locked{cursor:default;opacity:.55}.opt.locked.chosen{opacity:1}
.rcp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.rcp label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:.92rem;line-height:1.3}
.rcp label:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.rcp input{accent-color:var(--primary);margin-top:2px;flex:none}
.rcp small{display:block;color:var(--muted)}
.msgs{display:flex;flex-direction:column;gap:10px}
.msgs .field label{font-weight:600;font-size:.92rem}
.conf{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.conf button{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:52px;font-family:var(--font-d);font-size:1.4rem;font-weight:700;cursor:pointer}
.conf button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.scale{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-top:4px}
.decide .body{padding:16px;display:flex;flex-direction:column;gap:14px}
.chosen-sum{font-size:.9rem;border-left:3px solid var(--primary);padding-left:10px}

/* tulokset */
.res-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-top:24px}
.cmp td.num,.cmp th.num{text-align:right}
.diff.good{color:var(--good);font-weight:600}.diff.bad{color:var(--bad);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{padding:14px 16px}
.kpi .v{font-family:var(--font-d);font-size:1.8rem;font-weight:700;line-height:1.1}
.bar{height:8px;border-radius:2px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--primary)}
.bar.ai i{background:var(--ai)}
.csvbox{width:100%;min-height:140px;font-family:var(--font-m);font-size:.8rem}
.center{max-width:760px;margin:32px auto 0}
.condbar{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin-top:18px;padding:10px 16px;border-radius:10px;font-family:var(--font-d);font-weight:700;font-size:1.1rem;letter-spacing:.02em;border:1px solid var(--line);background:var(--surface)}
.condbar.ai{background:var(--ai-bg);border-color:var(--ai-line);color:var(--ai)}
.condbar .sub{font-family:var(--font-b);font-weight:400;font-size:.95rem;color:var(--muted);letter-spacing:0}
.aiopt{background:var(--surface);border:1px solid var(--ai-line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.aiopt.rec{border:2px solid var(--ai)}
.aiopt .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:.9rem;font-weight:600;color:var(--ai)}
.tag{font-family:var(--font-d);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.75rem;color:var(--ai)}
.doc{border-left:3px solid var(--line);padding:2px 0 2px 14px;max-width:70ch}.doc+.doc{margin-top:16px}.doc h3{margin-bottom:6px}
.rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.welcome-list{margin:0;padding-left:20px}.welcome-list li{margin:6px 0}
.codebox{width:100%;min-height:120px;font-family:var(--font-m);font-size:.78rem;line-height:1.4;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;word-break:break-all}
.sendbox{border-color:var(--alert-line);background:var(--alert-bg)}
.resume{border-color:var(--primary)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
label.btn{cursor:pointer}
a.btn{text-decoration:none}

.alertcard{margin-top:18px;border:1px solid var(--alert-line);border-radius:10px;overflow:hidden;background:var(--alert-bg)}
.alertcard .condbar{margin:0;border:0;border-radius:0;border-bottom:1px solid var(--alert-line);padding:8px 18px;font-size:1rem}
.alertcard .alert{margin:0;border:0;border-radius:0}
.guide{margin-top:12px;padding:10px 16px;border-radius:10px;background:var(--primary-soft);font-size:.95rem;line-height:1.5}
.stephint{margin:0;padding:8px 12px;border-radius:8px;background:var(--surface-2);font-size:.95rem}
.srcguide{display:flex;flex-direction:column;gap:8px}
.srcrow{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;cursor:pointer}
.srcrow:hover{border-color:var(--primary);background:var(--primary-soft)}
.srcrow span{color:var(--muted);font-size:.9rem}
.rgroup{display:flex;flex-direction:column;gap:6px}
.rgroup+.rgroup{margin-top:4px}
.aisit{margin-top:8px}
.ai .aiopt.rec{margin-top:10px;font-weight:400}
.aiother{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;background:var(--surface);border:1px solid var(--ai-line);border-radius:8px;padding:8px 12px;font-size:.92rem}
.aiother .cost{font-weight:600;color:var(--ai);white-space:nowrap}
.aiother .note{grid-column:1/-1}
.model .c{font-family:var(--font-b);font-weight:600;font-size:.8rem;line-height:1.15;text-align:center;padding:2px 4px}
.cmp th.grp{text-align:center;border-bottom:2px solid var(--line);color:var(--fg)}
.cmp th.grp-ai{color:var(--ai);border-bottom-color:var(--ai-line)}
.foot{color:var(--muted);font-size:.85rem;padding-block:28px 8px;text-align:center}


.linkbtn{background:none;border:0;padding:0;color:var(--primary);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
details.sd{border:1px solid var(--line);border-radius:8px;padding:10px 14px}
details.sd summary{cursor:pointer;font-weight:600}
.kv{display:grid;grid-template-columns:minmax(130px,auto) minmax(0,1fr);gap:6px 16px;margin:12px 0 4px}
.kv dt{font-family:var(--font-d);font-weight:600;letter-spacing:.04em;color:var(--muted)}
.kv dd{margin:0;min-width:0}
@media (max-width:600px){.kv{grid-template-columns:1fr}.kv dd{margin-bottom:6px}}

@media (max-width:860px){
  .home,.scgrid{grid-template-columns:1fr}
  .formgrid{grid-template-columns:1fr}
  .rcp{grid-template-columns:1fr}
  .alert{grid-template-columns:1fr}.alert .clock{grid-row:auto;border-right:0;padding-right:0}
}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .25s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   CONSTRUCTION NAVIGATOR SIMULATOR
   Testisimulaattori: runkovaiheen häiriöt ilman tekoälyä ja tekoälyavustajan kanssa.
   Metropolia Ammattikorkeakoulu, innovaatioprojekti 2026, Trimble Finland Oy:n toimeksiannosta.

   TÄMÄ ON TIEDOSTON MUOKATTAVA OSA. Muuta vain tämän skriptilohkon arvoja.
   Ohjeet: README.md (luovutusohje).
   ===================================================================== */

/* ---------- 1. ASETUKSET ---------- */
const CONFIG={
  /* Teksti aloitussivun yläreunassa */
  project:'Metropolia × Trimble · innovaatioprojekti',
  /* Tulosten automaattinen keruu Google-lomakkeella. Liitä tähän lomakkeen esitäytetty linkki
     (lomakkeen valikko → Hae esitäytetty linkki). Lomakkeessa on yksi Kappale-kysymys.
     Esimerkki: 'https://docs.google.com/forms/d/e/XXXX/viewform?usp=pp_url&entry.123456=x' */
  googleFormLink:'',
  /* Kenelle testaaja lähettää tulokset sähköpostilla, jos automaattinen keruu ei ole käytössä.
     Jos tyhjä, testaajaa pyydetään vastaamaan viestiin, jossa hän sai linkin. */

const b64u=bytes=>{let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb64u=str=>{str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';const b=atob(str);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
async function encodeRun(s){
  const raw=new TextEncoder().encode(JSON.stringify(s));let p;
  if(typeof CompressionStream!=='undefined'){const buf=await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();p='z'+b64u(new Uint8Array(buf))}
  else p='j'+b64u(raw);
  const body=p.match(/.{1,64}/g).join('\n');
  return 'CNSIM3.\n'+body+'\n.END';
}
async function decodeCode(p){
  const kind=p[0],bytes=unb64u(p.slice(1));
  if(kind==='z'){const txt=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();return JSON.parse(txt)}
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function importText(txt){
  const re=/CNSIM3\.([\s\S]*?)\.END/g;let m,ok=0,dup=0,bad=0,found=0;const names=[];
  while((m=re.exec(txt))){found++;
    try{const p=m[1].replace(/[\s>]/g,'');const s=await decodeCode(p);
      if(!s||!s.id||!Array.isArray(s.results)||s.v!==3)throw new Error('rakenne');
      if(S.runs.some(x=>x.id===s.id)){dup++;continue}
      s.src='koodi';s.importedAt=Date.now();await saveRun(s);ok++;names.push(s.nick||s.role||s.id);
    }catch(e){bad++}}
  const old=(txt.match(/CNSIM[12]\./g)||[]).length;
  return {found,ok,dup,bad,names,old};
}

function evalR(sess,r,R){

  return {...r,sess,sc,op,q:op.q,base,miss,dlc,total,best,excess:total-best,missing,missItems,dlItems,dlMet,
    req:op.to.length,reached:op.to.length-missing.length,allReached:!missing.length,extra:extraIds.length,extraIds,before,allTabs:all,
    changed:r.firstChoice!=null&&r.firstChoice!==r.choice,model:all.includes('malli'),docs:all.includes('suunnitelmat'),accepted:r.cond==='ai'?r.choice===sc.ai.rec:null,
    unedited:unedShare(r,op),flawed:!!sc.ai.flawed,tFirst:r.tFirst!=null?r.tFirst:r.tDec,tTot:(r.tDec||0)+(r.tInf||0)};
}

/* --- häiriö --- */
function tabBody(sc,t){
  if(!t)return `<div class="srcguide"><p class="note">Kaikki päätökseen tarvittava tieto löytyy näistä lähteistä. Avaa ne, joita tarvitset.</p>${TABS.map(([k,n])=>`<button class="srcrow" data-act="tab" data-t="${k}"><b>${n}</b><span>${TABDESC[k]}</span></button>`).join('')}</div>`;
  const chip=(st,txt)=>st?`<span class="st ${st}">${esc(txt||STL[st])}</span>`:esc(txt||'Suunniteltu');
  if(t==='aikataulu')return `<div class="tscroll"><table><thead><tr><th>Aika</th><th>Työvaihe</th><th>Tekijä</th><th>Tila</th></tr></thead><tbody>${sc.sched.map(r=>`<tr><td class="mono">${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${chip(r[3])}</td></tr>`).join('')}</tbody></table></div>`;
  if(t==='toimitukset')return `<div class="tscroll"><table><thead><tr><th>Kuorma</th><th>Sisältö</th><th>Suunniteltu</th><th>Tilanne</th></tr></thead><tbody>${sc.deliv.map(r=>`<tr><td class="mono">${esc(r[0])}</td><td>${esc(r[1])}</td><td class="mono">${esc(r[2])}</td><td>${chip(r[4],r[3])}</td></tr>`).join('')}</tbody></table></div>`;
  if(t==='resurssit')return `<div class="tscroll"><table><thead><tr><th>Resurssi</th><th>Tilanne</th></tr></thead><tbody>${sc.res.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${r[2]?chip(r[2],r[1]):esc(r[1])}</td></tr>`).join('')}</tbody></table></div>
    <h3 style="margin-top:16px">Kustannusarviot</h3><div class="tscroll"><table><tbody>${Object.keys(DEFAULT_RATES).map(k=>`<tr><td>${RATE_LABELS[k]}</td><td class="num mono">${DEFAULT_RATES[k].toLocaleString('fi-FI')} ${RATE_UNITS[k]}</td></tr>`).join('')}</tbody></table></div>`;
  if(t==='suunnitelmat')return [...DOCS_COMMON,...(sc.docs||[])].map(d=>`<div class="doc"><h3>${esc(d[0])}</h3><p>${esc(d[1])}</p></div>`).join('');
  if(t==='viestit')return sc.msgs.map(m=>`<div class="msg"><span class="t">${esc(m[0])}</span><span class="w">${esc(m[1])}</span><span>${esc(m[2])}</span></div>`).join('');
  if(t==='malli'){
    const cells=sc.model.map((r,i)=>{const fl=5-i;const cur=fl===sc.floor;
      return `<span class="fl ${cur?'cur':''}">${fl}. krs</span>`+[...r].map((ch,j)=>{const k=ch==='-'?'n':ch;return `<span class="c ${k} ${cur?'cur':''}" title="${fl}. krs lohko ${'ABC'[j]}: ${STN[ch]}">${STW[ch]}</span>`}).join('')}).join('');
    return `<div class="label" style="margin-bottom:8px">Runko, lohkot A–C · ${sc.floor}. kerros korostettu</div>
      <div class="model"><span></span><span class="hd">A</span><span class="hd">B</span><span class="hd">C</span>${cells}</div>
      <p class="note" style="margin-top:10px">Valmis = laatat asennettu ja juotettu · Asennettu = laatat paikoillaan, juotokset kesken · Odottaa laattoja = seinät valmiit · Tyhjä = ei aloitettu</p>
      <ul class="notes">${sc.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`;
  }
  return '';
}
function tabsHtml(){const c=S.cur;const seen=new Set(c.tabs.map(x=>x.tab));
  return TABS.map(([k,n])=>`<button role="tab" data-act="tab" data-t="${k}" aria-selected="${c.tab===k}" class="${seen.has(k)?'seen':''}">${n}</button>`).join('')}
function aiHtml(){
  const c=S.cur,sc=SC[c.sid],ai=sc.ai;
  const head=`<div class="hd"><i></i>Navigator-avustaja</div>`;
  const chain=`<h4>Vaikutusketju</h4><div class="chain">${ai.chain.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`;
  if(c.step===1){
    const recO=sc.opts.find(x=>x.id===ai.rec);

      return `<div class="aiother"><span>${esc(op.t)}</span><span class="cost">noin ${fmtE(round50(costOf(op.items,DEFAULT_RATES)))}</span><span class="note">${esc(op.c)}</span></div>`}).join('');

}
function msgAreaHtml(){
  const c=S.cur;
  if(!c.recip.length)return `<p class="note">Valitse vastaanottajat. Jokaiselle kirjoitetaan oma viesti.</p>`;
  return `<div class="msgs">${RECIP.filter(r=>c.recip.includes(r.id)).map(r=>`<div class="field"><label for="m-${r.id}"><b>Viesti: ${esc(r.n)}</b></label><textarea id="m-${r.id}" data-r="${r.id}" rows="2" placeholder="Mitä muuttuu ja mitä vastaanottajan pitää tehdä?">${esc(c.msgs[r.id]||'')}</textarea></div>`).join('')}</div>`;

function decideHtml(){
  const c=S.cur,sc=SC[c.sid];
  const steps=['Päätös','Tiedotus','Varmuus'].map((n,i)=>`<span class="${c.step===i+1?'on':c.step>i+1?'done':''}">${i+1} ${n}</span>`).join('');
  const chosen=c.choice?sc.opts.find(o=>o.id===c.choice):null;
  let body='';
  const hint=['',c.cond==='ai'?'Valitse, mitä teet. Voit noudattaa avustajan suositusta tai valita toisin.':'Tutki tiedot vasemmalta ja valitse, mitä teet.',
    c.cond==='ai'?'Avustaja valitsi vastaanottajat ja kirjoitti luonnokset. Tarkista, muokkaa tarvittaessa ja lähetä.':'Valitse, kenelle ilmoitat, ja kirjoita jokaiselle lyhyt viesti.','Viimeinen vaihe: kuinka varma olet päätöksestäsi?'][c.step];
  body+=`<p class="stephint">${hint}</p>`;
  if(c.step===1){
    body+=`<h3>Mitä teet seuraavaksi?</h3><div class="opts">${sc.opts.map(o=>`<label class="opt"><input type="radio" name="opt" value="${o.id}" ${c.choice===o.id?'checked':''}><span>${esc(o.t)}</span></label>`).join('')}</div>
      <div><button class="btn" data-act="decide" ${c.choice?'':'disabled'}>Vahvista päätös</button></div>`;
  }else if(c.step===2){
    body+=`<div class="chosen-sum"><span class="label">Päätöksesi</span><br>${esc(chosen.t)}<br><button class="linkbtn" data-act="backdec">Muuta päätöstä</button></div>
      <h3>Kenelle ilmoitat?</h3>
      ${[...new Set(RECIP.map(r=>r.g||'Muut'))].map(g=>`<div class="rgroup"><span class="label">${esc(g)}</span><div class="rcp">${RECIP.filter(r=>(r.g||'Muut')===g).map(r=>`<label><input type="checkbox" name="rcp" value="${r.id}" ${c.recip.includes(r.id)?'checked':''}><span>${esc(r.n)}<small>${esc(r.p)}</small></span></label>`).join('')}</div></div>`).join('')}
      <div id="msgarea">${msgAreaHtml()}</div>
      <p class="err" id="send-err" hidden></p>
      <div><button class="btn" data-act="send">Lähetä viestit</button></div>`;
  }else{
    body+=`<p class="chosen-sum"><span class="label">Päätöksesi</span><br>${esc(chosen.t)}</p>
      <p class="note">Viestit lähetetty: ${c.recip.map(r=>esc(RNAME[r])).join(', ')}</p>
      <h3>Kuinka varma olet päätöksestäsi?</h3>
      <div><div class="conf">${[1,2,3,4,5].map(v=>`<button data-act="conf" data-v="${v}" aria-pressed="${c.conf===v}">${v}</button>`).join('')}</div>
      <div class="scale"><span>1 = en lainkaan varma</span><span>5 = täysin varma</span></div></div>
      <div><button class="btn" data-act="finish" ${c.conf?'':'disabled'}>Seuraava</button></div>`;
  }
  return `<div class="panel decide"><div class="steps">${steps}</div><div class="body">${body}</div></div>`;
}

function vEnd(){
  const s=S.sess;const rows=measuredOf(s,DEFAULT_RATES);
  const totEx=rows.reduce((t,r)=>t+r.excess,0);
  const ql=q=>q===2?'<span class="st done">Paras</span>':q===1?'<span class="st risk">Hyväksyttävä</span>':'<span class="st late">Huono</span>';
  let send='';
  const to=CONFIG.contactEmail?`osoitteeseen <b class="mono" style="user-select:all">${esc(CONFIG.contactEmail)}</b>${CONFIG.contactName?' ('+esc(CONFIG.contactName)+')':''}`:'vastaukseksi viestiin, jossa sait testin linkin';
  if(!S.saved)send=`<section class="panel pad stack"><p class="note">Tallennetaan tuloksia…</p></section>`;
  else if(S.saved==='lomake')send=`<section class="panel pad stack"><div class="status ok"><i></i>Tulokset on lähetetty. Sinun ei tarvitse tehdä muuta.</div>
    <details class="sd"><summary>Lähetys ei onnistunut? Kopioi tulokset tästä</summary><p class="note" style="margin:10px 0">Jos saat meiltä viestin, että tulokset eivät tulleet perille, kopioi tämä teksti ja lähetä se meille sähköpostilla.</p>
    <textarea class="codebox" id="codebox" readonly>${esc(S.code||'')}</textarea><div class="row" style="margin-top:8px"><button class="btn ghost" data-act="copycode">Kopioi tulokset</button></div></details></section>`;
  else if(S.saved==='db')send=`<section class="panel pad stack"><div class="status ok"><i></i>Tulokset on tallennettu tulosnäkymään.</div></section>`;
  else if(S.saved==='lahetetty')send=`<section class="panel pad stack"><div class="status ok"><i></i>Tulokset on lähetetty. Kiitos!</div></section>`;
  else send=`<section class="panel pad stack sendbox"><h2>Lähetä tulokset meille</h2>
    <p>Tulokset ovat vielä vain tällä selaimella. Lähetä ne meille näin:</p>
    <ol class="welcome-list"><li>Paina <b>Kopioi tulokset</b>.</li><li>Liitä teksti sähköpostiin ja lähetä se ${to}.</li></ol>
    ${S.code?`<textarea class="codebox" id="codebox" readonly>${esc(S.code)}</textarea>
    <div class="row"><button class="btn" data-act="copycode">Kopioi tulokset</button>${CONFIG.contactEmail&&!IN_CLAUDE()?`<a class="btn ghost" href="mailto:${encodeURIComponent(CONFIG.contactEmail)}?subject=${encodeURIComponent('Simulaatiotestin tulokset – '+(S.sess.nick||''))}&body=${encodeURIComponent((S.code||'').length<1800?S.code:'Liitä tulokset tähän.')}">Avaa sähköposti</a>`:''}${canSaveFile()?'<button class="btn ghost" data-act="savecode">Tallenna tiedostona</button>':''}</div>
    <p class="note">Tekstissä ovat nimesi, vastauksesi, ajat ja kirjoittamasi viestit.</p>`:`<p class="note">Muodostetaan tuloksia…</p>`}</section>`;
  const list=rows.map(r=>`<tr><td class="mono">${r.n}</td><td>${esc(r.sc.title)}</td><td>${r.cond==='ai'?'<span class="cond-ai">Tekoäly</span>':'Ilman'}</td><td class="num">${fmtT(r.tDec)}</td><td class="num">${fmtT(r.tTot)}</td><td>${ql(r.q)}</td><td class="num">${r.reached}/${r.req}</td><td class="num">${fmtE(round50(r.excess))}</td></tr>`).join('');
  const best=rows.map(r=>{const b=r.sc.opts.find(o=>o.q===2);return `<li><b>${esc(r.sc.title)}:</b> ${esc(b.t)}</li>`}).join('');
  return `<main class="wrap center stack fade">
    <section class="panel pad stack"><span class="label">Testi valmis</span><h1>Kiitos osallistumisesta!</h1></section>
    ${send}
    <section class="panel pad stack"><h2>Miten päätöksesi vaikuttivat</h2>
      <p>Päätöstesi arvioitu ylimääräinen kustannus verrattuna parhaisiin ratkaisuihin oli yhteensä <b>${fmtE(round50(totEx))}</b>. Siihen sisältyvät valitun ratkaisun kulut sekä seuraukset siitä, jos joku tarvittava jäi ilman viestiä.</p>
      ${(()=>{const a=rows.filter(r=>r.cond==='ilman'),b=rows.filter(r=>r.cond==='ai');return a.length&&b.length?`<div class="cards"><div class="panel kpi"><span class="label">Ilman tekoälyä</span><div class="v num">${fmtT(median(a.map(r=>r.tTot)))}</div><span class="note">mediaani häiriötä kohden, päätös ${fmtT(median(a.map(r=>r.tDec)))}</span></div><div class="panel kpi"><span class="label">Tekoälyn kanssa</span><div class="v num">${fmtT(median(b.map(r=>r.tTot)))}</div><span class="note">mediaani häiriötä kohden, päätös ${fmtT(median(b.map(r=>r.tDec)))}</span></div></div>`:''})()}

      <details class="sd"><summary>Näytä parhaat ratkaisut</summary><ul class="notes">${best}</ul></details>
      <p class="note">Kustannukset ovat suuntaa antavia arvioita.</p></section>
    ${S.owner?`<div class="row"><button class="btn" data-act="nav" data-s="welcome">Uusi testi</button><button class="btn ghost" data-act="nav" data-s="results">Tulokset</button></div>`:''}
  </main>`;
}

/* ---------- järjestäjän tulosnäkymä ---------- */
const METRICS=[
  ['Päätösaika, mediaani',a=>median(a.map(r=>r.tDec)),fmtT,-1,'t'],
  ['  ensimmäiseen päätökseen, mediaani',a=>median(a.map(r=>r.tFirst)),fmtT,-1,'t'],
  ['Tiedotusaika, mediaani',a=>median(a.map(r=>r.tInf)),fmtT,-1,'t'],
  ['Kokonaisaika, mediaani',a=>median(a.map(r=>r.tTot)),fmtT,-1,'t'],
  ['Päätöksen laatu, ka (0–2)',a=>mean(a.map(r=>r.q)),x=>fmtN(x,2),1,'n'],
  ['Paras ratkaisu valittu',a=>pct(a.map(r=>r.q===2)),fmtP,1,'p'],
  ['Kaikki tarvittavat tavoitettu',a=>pct(a.map(r=>r.allReached)),fmtP,1,'p'],
  ['Turhat vastaanottajat, ka',a=>mean(a.map(r=>r.extra)),x=>fmtN(x,1),-1,'n'],

  ['Päätöstä muutettu tiedotusvaiheessa',a=>pct(a.map(r=>r.changed)),fmtP,0,'p'],
  ['Varmuus, ka (1–5)',a=>mean(a.map(r=>r.conf)),x=>fmtN(x,1),0,'n'],
  ['Lähteitä avattu ennen päätöstä, ka',a=>mean(a.map(r=>r.before.length)),x=>fmtN(x,1),0,'n'],
  ['Suunnitelmat ja sopimukset avattu',a=>pct(a.map(r=>r.docs)),fmtP,0,'p'],
  ['Tietomalli avattu',a=>pct(a.map(r=>r.model)),fmtP,0,'p']
];
function diffCell(a,b,dir,kind){
  if(a==null||b==null)return '<td class="num">–</td>';
  const d=b-a;const sg=d<0?'−':'+';let txt;
  if(kind==='t')txt=sg+fmtT(Math.abs(d));else if(kind==='p')txt=sg+Math.round(Math.abs(d)*100)+' %-yks.';else if(kind==='e')txt=sg+fmtE(Math.abs(d));else txt=sg+fmtN(Math.abs(d),Math.abs(d)<1?2:1);
  const cls=dir&&Math.abs(d)>1e-9?((d*dir>0)?'good':'bad'):'';return `<td class="num diff ${cls}">${txt}</td>`;
}
function cmpTable(A,B){

  </tbody></table></div>`;
}

function savingsHtml(A,B){
  const c=S.cfg.calc;const R=S.cfg.rates;
  const exA=mean(A.map(r=>r.excess)),exB=mean(B.map(r=>r.excess));

  const sEx=dEx!=null?dEx*perYear:null;const sT=dT!=null?dT*(+c.foremanRate||0)*perYear:null;

    <h3>Säästölaskelman oletukset</h3><div class="rates">${inp('calc','perMonth','Runkovaiheen häiriöitä kuukaudessa työmaalla','kpl',1)}${inp('calc','sites','Työmaiden määrä','kpl',1)}${inp('calc','foremanRate','Työnjohtajan tuntihinta','€/h',5)}</div>
    <div class="tscroll"><table class="cmp"><tbody>
      <tr><td>Ylimääräinen kustannus per häiriö, ilman → tekoäly</td><td class="num">${fmtE(exA)} → ${fmtE(exB)}</td></tr>
      <tr><td>Säästö per häiriö</td><td class="num">${fmtE(dEx)}</td></tr>
      <tr><td>Työnjohtajan aikasäästö per häiriö (mediaani)</td><td class="num">${dT==null?'–':fmtN(dT*60,1)+' min'}</td></tr>

    </tbody></table></div><p class="note">Laskelma skaalaa testin keskiarvot vuositasolle. Pienellä otoksella se on suuntaa antava, ja oletukset pitää kertoa raportissa.</p></section>`;
}

  const runs=id?S.runs.filter(s=>s.id===id):filteredRuns();
  const rows=runs.flatMap(s=>measuredOf(s).map(r=>{const sv=s.survey||{};
    return [q(s.nick||'Nimetön'),q(s.role),n(+s.exp),GROUPS[groupOf(s)],s.ver||'',q(fmtDate(s.startedAt)),s.src==='koodi'?'tuotu':'selain',r.n,r.sid,q(r.sc.title),r.sc.type,r.cond,n(r.tDec/1000),n(r.tFirst/1000),n(r.tInf/1000),n(r.tTot/1000),r.choice,r.firstChoice||r.choice,r.changed?1:0,r.q,
      n(r.base),n(r.miss),n(r.dlc),n(r.total),n(r.best),n(r.excess),r.req,r.reached,r.allReached?1:0,q(r.missing.map(x=>RNAME[x]).join(', ')),r.extra,q((r.recip||[]).map(x=>RNAME[x]).join(', ')),q(Object.entries(msgsOf(r)).map(([k,v])=>(RNAME[k]||k)+': '+v).join(' | ')),r.conf,
      q(r.before.map(t=>TABNAME[t]).join(', ')),q((r.tabs||[]).map(t=>TABNAME[t.tab]+(t.via==='ai'?' (avustaja)':'')+' '+Math.round(t.t/1000)+'s').join(' > ')),r.model?1:0,r.docs?1:0,r.dlMet==null?'':(r.dlMet?1:0),
      r.cond==='ai'?r.sc.ai.rec:'',r.accepted==null?'':(r.accepted?1:0),r.unedited==null?'':n(r.unedited),r.flawed?1:0,sv.use??'',sv.trust??'',sv.ease??'',sv.real??'',q(sv.comment||'')].join(';')}));
  return [cols.join(';'),...rows].join('\r\n');
}
async function exportCsv(id){
  const csv=buildCsv(id);const s=id&&S.runs.find(x=>x.id===id);
  const fn='cn-simulaatio-'+(s?(String(s.nick||'testaaja').replace(/[^A-Za-z0-9_-]/g,'')||'testaaja'):'tulokset')+'.csv';
  const st=await saveFile(fn,'\uFEFF'+csv,'text/csv;charset=utf-8');if(st==='saved'){toast('CSV-tiedosto tallennettu');return}if(st==='declined')return;
  S.csv=csv;S.csvTitle='CSV-tiedoston sisältö';render();
}

/* ---------- renderöinti ---------- */
function render(){
  let main='';
  if(S.screen==='welcome')main=vWelcome();
  else if(S.screen==='aiintro')main=vAiIntro();
  else if(S.screen==='ready')main=vReady();
  else if(S.screen==='scenario')main=vScenario();
  else if(S.screen==='survey')main=vSurvey();
  else if(S.screen==='end')main=vEnd();
  else if(S.screen==='results'){const ds=S.detail&&S.runs.find(x=>x.id===S.detail);if(S.detail&&!ds)S.detail=null;main=ds?vDetail(ds):vResults()}
  else if(S.screen==='noaccess')main=`<main class="wrap center panel pad stack fade"><h1>Tulokset näkyvät vain testin järjestäjälle</h1><p>Voit tehdä testin aloitussivulta.</p><div><button class="btn" data-act="nav" data-s="welcome">Siirry testiin</button></div></main>`;
  const foot=['welcome','end','results'].includes(S.screen)&&CONFIG.about?`<footer class="wrap foot">${esc(CONFIG.about)}</footer>`:'';
  app.innerHTML=topbar()+main+foot+`<div id="toast" role="status" class="toast" hidden></div>`;
  if(S.screen==='scenario'&&S.timer)tick();
}
function openTab(t,via){
  const c=S.cur;c.tabs.push({tab:t,t:Math.round(now()-c.t0),step:c.step,via});c.tab=t;
  document.getElementById('tabs').innerHTML=tabsHtml();document.getElementById('tabbody').innerHTML=tabBody(SC[c.sid],t);
}
function redrawDecide(){document.getElementById('decide').innerHTML=decideHtml();const ap=document.getElementById('aipanel');if(ap)ap.innerHTML=aiHtml()}
function saveCfgSoon(){if(!(S.owner&&S.db))return;clearTimeout(S.cfgTimer);S.cfgTimer=setTimeout(()=>{S.db.doc('config/settings').set(JSON.parse(JSON.stringify(S.cfg))).catch(()=>{})},800)}

/* ---------- tapahtumat ---------- */
app.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='nav'){const s=b.dataset.s;S.detail=null;S.csv=null;S.confirmDel=null;S.importMsg=null;
    S.screen=s;
    if(s==='welcome'){S.sess=null;S.resume=readResume()}render();window.scrollTo(0,0);return}
  if(a==='start'){start();return}
  if(a==='resume'){resume();return}
  if(a==='discard'){lsDel(LS_CUR);S.resume=null;render();return}
  if(a==='next'){advance();return}
  if(a==='tab'){openTab(b.dataset.t,'tab');return}
  if(a==='src'){openTab(b.dataset.t,'ai');return}
  if(a==='decide'){const c=S.cur;if(!c.choice)return;c.tDec=now()-c.t0;c.step=2;
    if(c.firstChoice==null){c.firstChoice=c.choice;c.tFirst=c.tDec}
    if(c.cond==='ai'&&c.draftFor!==c.choice){const op=SC[c.sid].opts.find(o=>o.id===c.choice);c.recip=[...op.to];c.msgs={...(op.m||{})};c.drafted=true;c.draftFor=c.choice}
    redrawDecide();return}
  if(a==='backdec'){const c=S.cur;document.querySelectorAll('#msgarea textarea[data-r]').forEach(t=>{c.msgs[t.dataset.r]=t.value});c.step=1;c.revisions++;redrawDecide();return}
  if(a==='send'){const c=S.cur;const err=document.getElementById('send-err');
    document.querySelectorAll('#msgarea textarea[data-r]').forEach(t=>{c.msgs[t.dataset.r]=t.value});
    if(!c.recip.length){err.textContent='Valitse vähintään yksi vastaanottaja.';err.hidden=false;return}
    const empty=c.recip.filter(k=>(c.msgs[k]||'').trim().length<3);
    if(empty.length){err.textContent='Kirjoita viesti: '+empty.map(k=>RNAME[k]).join(', ')+'.';err.hidden=false;return}
    c.tInf=now()-c.t0-c.tDec;c.step=3;redrawDecide();return}
  if(a==='conf'){S.cur.conf=+b.dataset.v;redrawDecide();return}
  if(a==='finish'){if(S.cur.conf)finishScenario();return}
  if(a==='sv'){S.sess.survey={...(S.sess.survey||{}),[b.dataset.k]:+b.dataset.v};b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));return}
  if(a==='survey-done'){const sv=S.sess.survey||{};const err=document.getElementById('sv-err');
    if(!sv.use||!sv.trust||!sv.ease||!sv.real){err.textContent='Vastaa neljään asteikkokysymykseen.';err.hidden=false;return}
    persist();advance();return}
  if(a==='copycode'){const ta=document.getElementById('codebox');try{await navigator.clipboard.writeText(S.code);toast('Tulokset kopioitu. Liitä ne sähköpostiin.')}catch(_){ta.focus();ta.select();toast('Teksti valittu. Kopioi se Ctrl+C:llä tai Cmd+C:llä.')}return}
  if(a==='savecode'){const st=await saveFile('cn-simulaatio-tulokset'+(S.sess.nick?'-'+S.sess.nick.replace(/[^A-Za-z0-9_-]/g,''):'')+'.txt',S.code);if(st==='saved')toast('Tiedosto tallennettu. Liitä se sähköpostiin.');else if(st==='fail')toast('Tallennus ei onnistunut. Kopioi tulokset tekstinä.');return}
  if(a==='import'){const txt=document.getElementById('imp-text').value;if(!txt.trim()){S.importMsg={err:true,text:'Liitä ensin sähköpostin teksti.'};render();return}
    const r=await importText(txt);S.importMsg=importReport(r);render();return}
  if(a==='open'){S.detail=b.dataset.id;S.csv=null;S.confirmDel=null;render();window.scrollTo(0,0);return}
  if(a==='back'){S.detail=null;S.csv=null;render();window.scrollTo(0,0);return}
  if(a==='csv'){exportCsv();return}
  if(a==='backup'){const codes=[];for(const s of S.runs){try{codes.push(await encodeRun(s))}catch(_){}}
    const txt='Construction Navigator Simulator – varmuuskopio '+new Date().toLocaleString('fi-FI')+'\nTestaajia: '+codes.length+'\nPalauta tuomalla tämä tiedosto Tuo tulokset -kohdassa.\n\n'+codes.join('\n\n')+'\n';
    const st=await saveFile('cn-simulaatio-varmuuskopio-'+new Date().toISOString().slice(0,10)+'.txt',txt);
    if(st==='saved'){toast('Varmuuskopio tallennettu');return}if(st==='declined')return;S.csv=txt;S.csvTitle='Varmuuskopio';render();return}
  if(a==='csv1'){exportCsv(b.dataset.id);return}
  if(a==='closecsv'){S.csv=null;render();return}
  if(a==='copycsv'){const ta=document.getElementById('csvbox');try{await navigator.clipboard.writeText(S.csv);toast('Kopioitu')}catch(_){ta.focus();ta.select();toast('Teksti valittu, kopioi Ctrl+C')}return}
  if(a==='del'){const id=b.dataset.id;if(S.confirmDel!==id){S.confirmDel=id;render();return}
    S.confirmDel=null;
    if(S.owner&&S.db){try{await S.db.doc('runs3/'+id).delete();toast('Testaaja poistettu')}catch(err){toast('Poisto epäonnistui.')}}
    else{delLocalRun(id);S.runs=localRuns();render();toast('Testaaja poistettu')}
    return}
});
function importReport(r){
  if(!r.found)return {err:true,text:r.old?'Tulokset ovat simulaattorin aiemmasta versiosta, eikä niitä voi verrata nykyisiin häiriöihin.':'Tekstistä ei löytynyt tuloskoodeja. Tarkista, että liitit koko viestin.'};
  const parts=[];if(r.ok)parts.push(`Tuotiin ${r.ok} ${r.ok===1?'testaaja':'testaajaa'}${r.names.length?' ('+r.names.join(', ')+')':''}.`);
  if(r.dup)parts.push(`${r.dup} oli jo tuotu.`);if(r.bad)parts.push(`${r.bad} koodia ei voitu lukea; pyydä testaajaa lähettämään tulokset uudelleen.`);
  return {err:!r.ok&&!r.dup,text:parts.join(' ')};
}
app.addEventListener('change',async e=>{
  const t=e.target;
  if(t.name==='opt'&&S.cur){S.cur.choice=t.value;const btn=document.querySelector('[data-act="decide"]');if(btn)btn.disabled=false;return}
  if(t.name==='rcp'&&S.cur){const c=S.cur;document.querySelectorAll('#msgarea textarea[data-r]').forEach(x=>{c.msgs[x.dataset.r]=x.value});
    if(t.checked){if(!c.recip.includes(t.value))c.recip.push(t.value)}else c.recip=c.recip.filter(x=>x!==t.value);
    document.getElementById('msgarea').innerHTML=msgAreaHtml();const er=document.getElementById('send-err');if(er)er.hidden=true;
    if(t.checked){const ta=document.getElementById('m-'+t.value);if(ta&&!ta.value)ta.focus()}return}
  if(t.id==='flt'){S.filter=t.value;render();return}
  if(t.id==='imp-file'&&t.files&&t.files.length){let txt='';for(const f of t.files){try{txt+='\n'+await f.text()}catch(_){}}
    const r=await importText(txt);S.importMsg=importReport(r);render();return}
  if(t.dataset.f){S.form[t.dataset.f]=t.value;return}
  if(t.dataset.cfg){const [g,k]=t.dataset.cfg.split('.');const v=parseFloat(String(t.value).replace(',','.'));if(!isNaN(v)&&v>=0){S.cfg[g][k]=v;saveCfgSoon();const y=window.scrollY;render();window.scrollTo(0,y)}return}
});
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.r&&S.cur){S.cur.msgs[t.dataset.r]=t.value;return}
  if(t.dataset.sv&&S.sess){S.sess.survey={...(S.sess.survey||{}),[t.dataset.sv]:t.value};return}
  if(t.dataset.f){S.form[t.dataset.f]=t.value}
});

/* ---------- käynnistys ---------- */
function readResume(){const r=lsGet(LS_CUR,null);return r&&r.sess&&r.sess.v===3&&r.sess.status==='kesken'&&Array.isArray(r.sess.order)?r:null}
function readHash(){try{const t=location.hash.replace('#','').toLowerCase().split('-');return {results:t.includes('tulokset'),ver:t.includes('a')?'A':t.includes('b')?'B':null}}catch(e){return {}}}
{const h=readHash();if(h.ver)S.forceVer=h.ver;if(h.results){S.wantResults=true;S.screen='results'}}
window.addEventListener('hashchange',()=>{const h=readHash();if(h.ver)S.forceVer=h.ver;
  if(h.results&&!['scenario','aiintro','ready','survey'].includes(S.screen)){S.screen='results';S.detail=null;render()}});
S.resume=readResume();S.runs=localRuns();
render();
(async()=>{
  const use=n=>window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  const [db,user]=await Promise.all([use('db'),use('user')]);
  let owner=false;try{owner=user?!!(await user.isOwner()):false}catch(e){owner=false}
  S.db=db;S.owner=!!(owner&&db);
  if(S.owner){
    try{const d=await db.doc('config/settings').get();if(d.exists){const v=d.data();S.cfg={rates:{...DEFAULT_RATES,...(v.rates||{})},calc:{...S.cfg.calc,...(v.calc||{})}}}}catch(e){}
    try{db.collection('runs3').onSnapshot(snap=>{S.runs=snap.docs.map(d=>d.data());if(['welcome','results','end'].includes(S.screen)){const y=window.scrollY;render();window.scrollTo(0,y)}},()=>{})}catch(e){}
    if(S.sess)persist();
  }
  if(S.wantResults&&['welcome'].includes(S.screen))S.screen='results';
  if(['welcome','results','noaccess','end'].includes(S.screen))render();
  S.dl=await use('downloads');
  if(S.screen==='end')render();
})();

</script>
